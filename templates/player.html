<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ video.title }} | اتاق گفتگو و تماشای گروهی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f1015;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .party-container {
            display: grid;
            grid-template-columns: 1.1fr 1.9fr;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
            height: 720px;
        }
        @media (max-width: 850px) {
            .party-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        /* بخش اطلاعات فیلم */
        .movie-card {
            background: #181a20;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #282b34;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .movie-header h1 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            background: #238636;
            color: #fff;
            margin-bottom: 14px;
        }
        .movie-desc {
            font-size: 14px;
            line-height: 1.7;
            color: #aaa;
        }
        .party-info {
            background: #111317;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #22252d;
            font-size: 13px;
            color: #888;
        }
        .party-info strong {
            color: #eee;
        }

        /* بخش چت روم */
        .chat-section {
            background: #181a20;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #282b34;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 16px 20px;
            background: #1f222a;
            border-bottom: 1px solid #282b34;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e53935;
            transition: background 0.3s;
        }
        .status-dot.online {
            background: #00e676;
            box-shadow: 0 0 8px #00e676;
        }
        .auth-bar {
            padding: 12px 16px;
            background: #14161c;
            border-bottom: 1px solid #242731;
            display: flex;
            gap: 10px;
        }
        .auth-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333742;
            background: #0f1015;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .auth-bar button, .chat-input-bar button {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .auth-bar button:hover, .chat-input-bar button:hover {
            background: #b20710;
        }
        .chat-messages {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-bubble {
            background: #21242d;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 80%;
            line-height: 1.5;
            word-break: break-word;
            align-self: flex-start;
        }
        .msg-bubble.mine {
            background: #2b394e;
            align-self: flex-end;
        }
        .msg-author {
            font-size: 11px;
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 3px;
        }
        .msg-bubble.mine .msg-author {
            color: #64b5f6;
        }
        .msg-time {
            font-size: 10px;
            color: #777;
            margin-right: 6px;
            font-weight: normal;
        }
        .system-bubble {
            align-self: center;
            font-size: 12px;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .chat-input-bar {
            padding: 14px 16px;
            background: #1f222a;
            border-top: 1px solid #282b34;
            display: flex;
            gap: 10px;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #333742;
            background: #0f1015;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .chat-input-bar button:disabled {
            background: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="party-container">
    <div class="movie-card">
        <div class="movie-header">
            <span class="badge">Watch Party Room</span>
            <h1>{{ video.title }}</h1>
            <p class="movie-desc">{{ video.description }}</p>
        </div>
        <div class="party-info">
            <p>🎬 شناسه اتاق: <strong>{{ video.id }}</strong></p>
            <p style="margin-top: 6px;">⚡ اتصال زنده با وب‌سوکت Django Channels</p>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-header">
            <span class="chat-title">گفتگوی زنده تماشای {{ video.title }}</span>
            <div class="status-badge">
                <span id="connLabel">قطع ارتباط</span>
                <span id="connStatus" class="status-dot"></span>
            </div>
        </div>

        <div class="auth-bar">
            <input type="text" id="jwtTokenInput" placeholder="Access Token JWT...">
            <button id="connectBtn" onclick="initWebSocket()">ورود به چت</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="پیامی بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()" disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>ارسال</button>
        </div>
    </div>
</div>

<script>
    const videoId = "{{ video.id }}";
    const chatMessages = document.getElementById("chatMessages");
    const connStatus = document.getElementById("connStatus");
    const connLabel = document.getElementById("connLabel");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const tokenInput = document.getElementById("jwtTokenInput");

    let socket = null;
    let heartbeatTimer = null;
    let myUsername = "";

    const savedToken = localStorage.getItem("access_token");
    if (savedToken) tokenInput.value = savedToken;

    function initWebSocket() {
        const token = tokenInput.value.trim();
        if (!token) return alert("لطفاً توکن معتبر JWT را وارد کنید.");
        localStorage.setItem("access_token", token);

        if (socket) {
            clearInterval(heartbeatTimer);
            socket.close();
        }

        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const wsUrl = `${wsProtocol}${window.location.host}/ws/watch/${videoId}/?token=${encodeURIComponent(token)}`;
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            connStatus.className = "status-dot online";
            connLabel.innerText = "آنلاین";
            chatInput.disabled = false;
            sendBtn.disabled = false;
            appendSystemMessage("ارتباط برقرار شد. شما وارد چت روم شدید.");

            // ارسال پینگ دوره‌ای هر ۴ ثانیه برای حفظ دائمی سوکت ردیس
            heartbeatTimer = setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ action: "ping" }));
                }
            }, 4000);
        };

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.event_type === "pong") return;

            if (data.event_type === "chat_message") {
                appendChatMessage(data.sender, data.message, data.timestamp);
            } else if (data.event_type === "system") {
                appendSystemMessage(data.message);
            }
        };

        socket.onclose = () => {
            clearInterval(heartbeatTimer);
            connStatus.className = "status-dot";
            connLabel.innerText = "قطع ارتباط";
            chatInput.disabled = true;
            sendBtn.disabled = true;
            appendSystemMessage("اتصال به چت روم قطع شد.");
        };
    }

    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({ action: "chat_message", message: text }));
        chatInput.value = "";
    }

    function appendChatMessage(sender, text, timestamp) {
        const d = document.createElement("div");
        d.className = "msg-bubble";
        const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        d.innerHTML = `<div class="msg-author">${sender} <span class="msg-time">${timeStr}</span></div><div>${text}</div>`;
        chatMessages.appendChild(d);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendSystemMessage(msg) {
        const d = document.createElement("div");
        d.className = "system-bubble";
        d.innerText = msg;
        chatMessages.appendChild(d);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>
</body>
</html>
